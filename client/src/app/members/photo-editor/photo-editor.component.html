<div class="row">
    @for (photo of member().photos; track photo.id) {
        <div class="col-2">
            <img src="{{photo.url}}" alt="photo of user" class="img-thumbnail mb-1">
            <div class="text-center">
                <button class="btn btn-sm" [class.btn-success]="photo.isMain" [class.btn-outline-success]="!photo.isMain"
                  (click)="setMainPhoto(photo)" [disabled]="photo.isMain">Main</button>
                <button class="btn btn-sm btn-danger" (click)="deletePhoto(photo)" [disabled]="photo.isMain">
                  <i class="fa fa-trash"></i>
                </button>
    
            </div>
    
        </div>
    }

</div>
<!-- ng photo upload code -->
<div class="row">
 
    <div class="col-md-3">

        <h3>Select files</h3>

        <div ng2FileDrop
             [ngClass]="{ 'nv-file-over': hasBaseDropZoneOver }"
             (fileOver)="fileOverBase($event)"
             [uploader]="uploder"
             class="well my-drop-zone">
            Base drop zone
        </div>

        Multiple
        <input type="file" ng2FileSelect [uploader]="uploder" multiple  /><br/>

        Single
        <input type="file" ng2FileSelect [uploader]="uploder" />
    </div>

    <div class="col-md-9" style="margin-bottom: 40px">

        <h3>Upload queue</h3>
        <p>Queue length: {{ uploder?.queue?.length }}</p>

        <table class="table">
            <thead>
            <tr>
                <th width="50%">Name</th>
                <th>Size</th>
                <th>Progress</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let item of uploder?.queue">
                <td><strong>{{ item?.file?.name }}</strong></td>
                <td *ngIf="uploder?.options?.isHTML5" nowrap>{{ item?.file?.size/1024/1024 | number:'.2' }} MB</td>
                <td *ngIf="uploder?.options?.isHTML5">
                    <div class="progress" style="margin-bottom: 0;">
                        <div class="progress-bar" role="progressbar" [ngStyle]="{ 'width': item.progress + '%' }"></div>
                    </div>
                </td>
                <td class="text-center">
                    <span *ngIf="item.isSuccess"><i class="glyphicon glyphicon-ok"></i></span>
                    <span *ngIf="item.isCancel"><i class="glyphicon glyphicon-ban-circle"></i></span>
                    <span *ngIf="item.isError"><i class="glyphicon glyphicon-remove"></i></span>
                </td>
                <td nowrap>
                    <button type="button" class="btn btn-success btn-xs"
                            (click)="item.upload()" [disabled]="item.isReady || item.isUploading || item.isSuccess">
                        <span class="glyphicon glyphicon-upload"></span> Upload
                    </button>
                    <button type="button" class="btn btn-warning btn-xs"
                            (click)="item.cancel()" [disabled]="!item.isUploading">
                        <span class="glyphicon glyphicon-ban-circle"></span> Cancel
                    </button>
                    <button type="button" class="btn btn-danger btn-xs"
                            (click)="item.remove()">
                        <span class="glyphicon glyphicon-trash"></span> Remove
                    </button>
                </td>
            </tr>
            </tbody>
        </table>

        <div>
            <div>
                Queue progress:
                <div class="progress" style="">
                    <div class="progress-bar" role="progressbar" [ngStyle]="{ 'width': uploder?.progress + '%' }"></div>
                </div>
            </div>
            <button type="button" class="btn btn-success btn-s"
                    (click)="uploder?.uploadAll()" [disabled]="!uploder?.getNotUploadedItems()?.length">
                <span class="glyphicon glyphicon-upload"></span> Upload all
            </button>
            <button type="button" class="btn btn-warning btn-s"
                    (click)="uploder?.cancelAll()" [disabled]="!uploder?.isUploading">
                <span class="glyphicon glyphicon-ban-circle"></span> Cancel all
            </button>
            <button type="button" class="btn btn-danger btn-s"
                    (click)="uploder?.clearQueue()" [disabled]="!uploder?.queue?.length">
                <span class="glyphicon glyphicon-trash"></span> Remove all
            </button>
        </div>

    </div>

</div>
